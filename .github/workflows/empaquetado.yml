# CI de empaquetado de ProxLaunch (RF-E30, AR-10), activa en ejecutores alojados de GitHub.
# Esta es la ÚNICA fuente de verdad de la CI; la descripción y el coste están en docs/empaquetado.md §7.
#
# Disparadores (decisión del usuario: repo privado y cupo de minutos): solo al subir etiquetas v* y a mano
# (`gh workflow run empaquetado.yml`). No hay disparo por ramas ni por pull_request.
#
# Solo invoca los scripts de empaquetado/ (no duplica lógica). Permisos del token: solo lectura.
# No usa secretos, no publica nada. Los instaladores NO se suben como artefactos: solo los registros de
# build (7 días) y, entre los trabajos de Linux, el .deb recién construido (1 día) para verificarlo en 24.04.
# Nota (HV-E6): los ejecutores de Windows son Windows Server, no un escritorio Windows 10/11; la
# verificación con escritorio real sigue siendo la de la MV local.
name: ProxLaunch - calidad, construccion y verificacion

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: empaquetado-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Se construye SOLO en Ubuntu 22.04: la glibc del congelado debe ser <= 2.35 (CA-E05.1), y construir-linux.sh
  # ya incluye calidad.sh (no se llama aparte para no ejecutar la suite dos veces).
  construir-linux:
    name: Linux - calidad y construccion (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preparar bibliotecas de construccion
        run: bash empaquetado/linux/preparar-build.sh
      - name: Calidad y construccion del .deb
        run: bash empaquetado/construir-linux.sh
      # El .deb solo viaja al trabajo de verificacion; se borra al dia siguiente (no se conserva).
      # actions/upload-artifact v7.0.2
      - name: Pasar el .deb a la verificacion (retencion de 1 dia)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deb-intermedio
          path: dist/proxlaunch_*_amd64.deb
          retention-days: 1
          if-no-files-found: error
      # actions/upload-artifact v7.0.2
      - name: Registros de build (retencion de 7 dias)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: registros-construir-linux
          path: build/registros/
          retention-days: 7
          if-no-files-found: ignore

  verificar-linux:
    name: Linux - verificar el .deb instalado (${{ matrix.os }})
    needs: construir-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/download-artifact v8.0.2
      - name: Recibir el .deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: deb-intermedio
          path: dist
      # Instala xvfb, dbus, gnome-keyring y desktop-file-utils que necesita verificar-deb.sh.
      - name: Preparar herramientas de verificacion
        run: bash empaquetado/linux/preparar-build.sh
      - name: Verificar el .deb instalado
        run: bash empaquetado/verificar-deb.sh dist/proxlaunch_*_amd64.deb
      # Solo tras verificar con exito: el .deb que se publica en la release (se sella al descargarlo).
      # actions/upload-artifact v7.0.2
      - name: Guardar el .deb verificado (retencion de 7 dias)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deb-verificado
          path: dist/proxlaunch_*_amd64.deb
          retention-days: 7
          if-no-files-found: error
      # actions/upload-artifact v7.0.2
      - name: Registros de verificacion (retencion de 7 dias)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: registros-verificar-linux-${{ matrix.os }}
          path: build/registros/
          retention-days: 7
          if-no-files-found: ignore

  # Windows PowerShell 5.1 (shell: powershell), el mismo que se uso en la MV local; construir-windows.ps1
  # ya incluye calidad.ps1.
  windows:
    name: Windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    defaults:
      run:
        shell: powershell
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Hace el papel del anfitrion de verificar-todo.sh: descarga CPython e Inno Setup con la suma SHA-256
      # fijada en herramientas.json (usa el Python del ejecutor solo para este script de biblioteca estandar).
      - name: Descargar las herramientas fijadas (SHA-256)
        run: python -I empaquetado/entornos/windows/descargar-herramientas.py --destino "$HOME\herramientas"
      - name: Instalar herramientas de construccion
        run: empaquetado/windows/preparar-build.ps1
      - name: Calidad y construccion del instalador
        run: empaquetado/construir-windows.ps1
      - name: Verificar el instalador
        run: empaquetado/verificar-windows.ps1 -PermitirFueraDeLaMV
      # Solo tras verificar con exito: el instalador que se publica en la release.
      # actions/upload-artifact v7.0.2
      - name: Guardar el instalador verificado (retencion de 7 dias)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: instalador-verificado-${{ matrix.os }}
          path: dist/proxlaunch-*-windows-x64-setup.exe
          retention-days: 7
          if-no-files-found: error
      # actions/upload-artifact v7.0.2
      - name: Registros de build (retencion de 7 dias)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: registros-windows-${{ matrix.os }}
          path: build/registros/
          retention-days: 7
          if-no-files-found: ignore
